name: Daily Stock Fund Netlify Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

concurrency:
  group: daily-netlify-report
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
      STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      ENABLE_NOTIFICATION: "false"
      REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || secrets.REPORT_LANGUAGE || 'zh' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create runtime directories
        run: |
          mkdir -p logs reports public

      - name: Run analysis
        run: |
          set +e
          python main.py --no-notify > logs/main-run.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "main.py exited with status $status" | tee logs/analysis-error.txt
          fi
          echo "MAIN_EXIT_CODE=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Export static site
        run: |
          python scripts/export_static_site.py --output public

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netlify-static-site-${{ github.run_number }}
          path: |
            public/
            logs/
          retention-days: 30

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

      - name: Summarize result
        if: always()
        run: |
          echo "main.py exit code: ${MAIN_EXIT_CODE:-0}"
          test -f public/index.html
          test -f public/reports/latest.html
          test -f public/data/latest.json
